<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Grabadora de Audio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap">

<style>
  /* ── tokens ── */
  :root {
    --bg:           #1a1a1a;
    --surface:      #2a2a2a;
    --btn-idle:     #3a3a3a;
    --btn-idle-bdr: #4a4a4a;
    --btn-record:   #e8433a;
    --btn-rec-dark: #c73029;
    --btn-mimic:    #3a3a3a;
    --fg:           #ffffff;
    --fg-muted:     rgba(255,255,255,0.5);
    --glow-red:     rgba(232,67,58,0.35);
    --glow-grn:     rgba(52,211,153,0.3);
    --active-grn:   #059669;
    --active-grn-d: #047857;
    --playing-blue: #2563eb;
    --dot:          rgba(255,255,255,0.3);
    --dot-act:      #ffffff;
    color-scheme: dark;
  }

  /* intentionally dark-only — matches the reference app */

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', system-ui, sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-inline: 16px;
    padding-block: 24px;
    gap: 0;
    overflow-x: hidden;
  }

  /* ── Permission banner ── */
  #permBanner {
    width: 100%;
    max-width: 480px;
    background: #1f2937;
    border: 1px solid #374151;
    border-radius: 14px;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 20px;
  }
  #permBanner[hidden] { display: none; }
  .perm-title {
    font-size: 0.92rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .perm-title svg { width:18px; height:18px; fill:#facc15; flex-shrink:0; }
  .perm-desc { font-size: 0.78rem; color: var(--fg-muted); line-height: 1.5; }
  #btnGrantPerm {
    align-self: flex-end;
    background: var(--btn-record);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 18px;
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.03em;
    transition: background 0.15s;
  }
  #btnGrantPerm:hover { background: var(--btn-rec-dark); }

  /* ── Status bar ── */
  .status-bar {
    width: 100%;
    max-width: 480px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4px;
    margin-bottom: 16px;
    min-height: 22px;
  }
  .status-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--fg-muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--fg-muted);
    flex-shrink: 0;
    transition: background 0.25s;
  }
  .status-dot.rec  { background: var(--btn-record); animation: blink 1s ease-in-out infinite; }
  .status-dot.play { background: var(--playing-blue); animation: blink 1s ease-in-out infinite; }
  .status-dot.rev  { background: var(--active-grn); animation: blink 0.75s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

  .timer {
    font-size: 0.75rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--fg-muted);
    letter-spacing: 0.05em;
  }

  /* ── Waveform ── */
  .viz-wrap {
    width: 100%;
    max-width: 480px;
    height: 60px;
    border-radius: 12px;
    background: #111;
    overflow: hidden;
    margin-bottom: 20px;
    border: 1px solid #333;
  }
  #viz { display: block; width: 100%; height: 100%; }

  /* ── Groups ── */
  .app {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .group-sep {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 4px;
  }
  .group-sep::before, .group-sep::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #333;
  }
  /* dots like in the photo */
  .dots {
    display: flex;
    gap: 5px;
    align-items: center;
  }
  .dots span {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--dot);
  }

  /* ── Big buttons ── */
  .btn {
    width: 100%;
    border: none;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 24px 16px 20px;
    cursor: pointer;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 0.88rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg);
    transition: transform 0.12s, box-shadow 0.2s, background 0.2s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    outline: none;
    position: relative;
    overflow: hidden;
  }
  .btn:focus-visible { outline: 2px solid rgba(255,255,255,0.4); outline-offset: 3px; }
  .btn:active:not(:disabled) { transform: scale(0.97); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* icon container */
  .btn-icon {
    width: 52px; height: 52px;
    display: flex; align-items: center; justify-content: center;
  }
  .btn-icon svg { width: 100%; height: 100%; fill: currentColor; }

  /* RECORD ORIGINAL — red */
  .btn-rec-orig {
    background: var(--btn-record);
    box-shadow: 0 4px 20px var(--glow-red);
  }
  .btn-rec-orig:hover:not(:disabled) { background: var(--btn-rec-dark); }
  .btn-rec-orig.active {
    background: var(--btn-rec-dark);
    box-shadow: 0 0 0 4px var(--glow-red), 0 4px 20px var(--glow-red);
  }

  /* PLAY BACKWARDS (original) — grey */
  .btn-play-orig {
    background: var(--btn-idle);
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    border: 1px solid var(--btn-idle-bdr);
  }
  .btn-play-orig:hover:not(:disabled) { background: #444; }
  .btn-play-orig.active {
    background: var(--playing-blue);
    border-color: var(--playing-blue);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.3);
  }

  /* RECORD MIMIC — grey */
  .btn-rec-mimic {
    background: var(--btn-idle);
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    border: 1px solid var(--btn-idle-bdr);
  }
  .btn-rec-mimic:hover:not(:disabled) { background: #444; }
  .btn-rec-mimic.active {
    background: var(--active-grn);
    border-color: var(--active-grn);
    box-shadow: 0 0 0 4px var(--glow-grn), 0 4px 20px var(--glow-grn);
  }

  /* PLAY BACKWARDS (mimic) — grey */
  .btn-play-mimic {
    background: var(--btn-idle);
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    border: 1px solid var(--btn-idle-bdr);
  }
  .btn-play-mimic:hover:not(:disabled) { background: #444; }
  .btn-play-mimic.active {
    background: var(--active-grn);
    border-color: var(--active-grn);
    box-shadow: 0 0 0 3px var(--glow-grn);
  }

  /* Progress strip at bottom of playing button */
  .btn-progress {
    position: absolute;
    bottom: 0; left: 0;
    height: 3px;
    width: 0%;
    background: rgba(255,255,255,0.55);
    border-radius: 0 0 18px 18px;
    transition: width 0.1s linear;
  }

  @media (prefers-reduced-motion: reduce) {
    .status-dot { animation: none !important; }
    .btn { transition: none; }
  }

  @media (max-width: 400px) {
    .btn { padding: 20px 12px 16px; border-radius: 14px; }
    .btn-icon { width: 44px; height: 44px; }
    .btn { font-size: 0.82rem; }
  }
</style>

<!-- Permission banner -->
<div id="permBanner">
  <div class="perm-title">
    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2zm.75 14.5h-1.5v-6h1.5v6zm0-8h-1.5V7h1.5v1.5z"/></svg>
    Permiso de micrófono necesario
  </div>
  <div class="perm-desc">Esta app necesita acceso al micrófono para grabar audio. El permiso es solo para esta página y no se comparte con nadie.</div>

<!-- Status -->
<div class="status-bar">
  <div class="status-pill">
    <span class="status-dot" id="sDot"></span>
    <span id="sText">Listo</span>

<div class="viz-wrap"><canvas id="viz"></canvas></div>

<!-- Buttons -->
<div class="app">

  <!-- GROUP 1: Original -->

      <div class="btn-icon" id="iconRecOrig">

<script>
(function(){
'use strict';

/* ── SVG paths ── */
const IC = {
  mic:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3zm-1 3a1 1 0 0 1 2 0v8a1 1 0 0 1-2 0V4zM7 11a1 1 0 0 1 1 1 4 4 0 0 0 8 0 1 1 0 1 1 2 0 6 6 0 0 1-5 5.92V20h2a1 1 0 1 1 0 2H9a1 1 0 1 1 0-2h2v-3.08A6 6 0 0 1 6 12a1 1 0 0 1 1-1z"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="3"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6l-8.5 6z"/></svg>',
  spin: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 1 0 20A10 10 0 0 1 12 2zm1 5h-2v5.41l3.29 3.3 1.42-1.42L13 11.58V7z"/></svg>',
};
function setIcon(el, key){ el.innerHTML = IC[key]; }

/* ── DOM refs ── */
const permBanner  = document.getElementById('permBanner');
const btnGrant    = document.getElementById('btnGrantPerm');
const permDesc    = document.querySelector('.perm-desc');
const sDot        = document.getElementById('sDot');
const sText       = document.getElementById('sText');
const timerEl     = document.getElementById('timerEl');
const vizCanvas   = document.getElementById('viz');
const ctx2d       = vizCanvas.getContext('2d');

const btnRecOrig  = document.getElementById('btnRecOrig');
const btnPlayOrig = document.getElementById('btnPlayOrig');
const btnRecMimic = document.getElementById('btnRecMimic');
const btnPlayMimic= document.getElementById('btnPlayMimic');

const iconRecOrig  = document.getElementById('iconRecOrig');
const iconPlayOrig = document.getElementById('iconPlayOrig');
const iconRecMimic = document.getElementById('iconRecMimic');
const iconPlayMimic= document.getElementById('iconPlayMimic');

const lblRecOrig   = document.getElementById('lblRecOrig');
const lblPlayOrig  = document.getElementById('lblPlayOrig');
const lblRecMimic  = document.getElementById('lblRecMimic');
const lblPlayMimic = document.getElementById('lblPlayMimic');

const prPlayOrig   = document.getElementById('prPlayOrig');
const prPlayMimic  = document.getElementById('prPlayMimic');

/* ── Canvas resize ── */
function resizeCanvas(){
  const dpr = window.devicePixelRatio || 1;
  const w = vizCanvas.offsetWidth;
  const h = vizCanvas.offsetHeight;
  vizCanvas.width  = w * dpr;
  vizCanvas.height = h * dpr;
  ctx2d.setTransform(dpr,0,0,dpr,0,0);
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

/* ── State ── */
let micGranted     = false;
let audioCtx       = null;
let analyser       = null;
let animId         = null;
let timerIv        = null;
let recSecs        = 0;

// Original track
let origBuffer     = null;
let origRevBuffer  = null;
let origRecorder   = null;
let origChunks     = [];
let origPlaying    = false;
let origSource     = null;
let origPrRaf      = null;

// Mimic track
let mimicBuffer    = null;
let mimicRevBuffer = null;
let mimicRecorder  = null;
let mimicChunks    = [];
let mimicPlaying   = false;
let mimicSource    = null;
let mimicPrRaf     = null;

// Which group is recording?
let recording      = null; // 'orig' | 'mimic' | null

/* ── Permission ── */
// Llama a getUserMedia — SOLO desde un gesto de usuario (click)
async function grantMic() {
  btnGrant.disabled = true;
  btnGrant.textContent = 'Solicitando…';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    stream.getTracks().forEach(t => t.stop());
    permBanner.hidden = true;
    micGranted = true;
    setStatus('', 'Listo', false);
  } catch(e) {
    btnGrant.disabled = false;
    btnGrant.textContent = 'Permitir micrófono';
    if (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError') {
      permDesc.textContent = 'Permiso denegado. Actívalo en la configuración del navegador (icono 🔒 en la barra de dirección) y recarga la página.';
    } else {
      permDesc.textContent = 'No se pudo acceder al micrófono: ' + e.message;
    }
    setStatus('', 'Sin micrófono', false);
  }
}

btnGrant.addEventListener('click', grantMic);

// Al cargar: comprobar si el permiso ya está concedido (sin pedir nada al usuario)
// Si ya está granted ocultamos el banner; si está denied mostramos aviso; si es prompt mostramos el banner
document.addEventListener('DOMContentLoaded', async () => {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    permDesc.textContent = 'Tu navegador no soporta grabación de audio.';
    btnGrant.disabled = true;
    setStatus('', 'No soportado', false);
    return;
  }

  // Comprobación silenciosa del estado del permiso (no lanza diálogo)
  try {
    const perm = await navigator.permissions.query({ name: 'microphone' });
    if (perm.state === 'granted') {
      permBanner.hidden = true;
      micGranted = true;
      setStatus('', 'Listo', false);
    } else if (perm.state === 'denied') {
      permDesc.textContent = 'Permiso denegado. Actívalo en la configuración del navegador (icono 🔒) y recarga.';
      btnGrant.disabled = true;
      setStatus('', 'Permiso denegado', false);
    }
    // Si es 'prompt' → se muestra el banner con el botón, el usuario pulsa y lanza el diálogo
    perm.onchange = () => {
      if (perm.state === 'granted') {
        permBanner.hidden = true;
        micGranted = true;
        setStatus('', 'Listo', false);
      }
    };
  } catch(_) {
    // Navegador sin Permissions API (ej. Firefox antiguo): mostrar banner directamente
    // El usuario pulsa el botón → grantMic() lanza el diálogo nativo
  }
});

/* ── Helpers ── */
function getCtx(){
  if (!audioCtx || audioCtx.state === 'closed')
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function setStatus(dotClass, text, showTimer){
  sDot.className = 'status-dot' + (dotClass ? ' '+dotClass : '');
  sText.textContent = text;
  timerEl.hidden = !showTimer;
}

function startTimer(){
  recSecs = 0;
  timerEl.textContent = '0:00';
  timerEl.hidden = false;
  timerIv = setInterval(() => {
    recSecs++;
    const m = Math.floor(recSecs/60);
    const s = String(recSecs%60).padStart(2,'0');
    timerEl.textContent = m+':'+s;
  }, 1000);
}
function stopTimer(){ clearInterval(timerIv); timerEl.hidden = true; }

/* ── Visualiser ── */
function drawIdle(){
  const w = vizCanvas.offsetWidth, h = vizCanvas.offsetHeight;
  ctx2d.clearRect(0,0,w,h);
  ctx2d.strokeStyle = '#333';
  ctx2d.lineWidth = 1;
  ctx2d.beginPath();
  ctx2d.moveTo(0, h/2); ctx2d.lineTo(w, h/2);
  ctx2d.stroke();
}

function drawWave(data, color){
  const w = vizCanvas.offsetWidth, h = vizCanvas.offsetHeight;
  ctx2d.clearRect(0,0,w,h);
  const bw = w / data.length;
  ctx2d.lineWidth = 1.5;
  ctx2d.strokeStyle = color;
  ctx2d.beginPath();
  for(let i=0;i<data.length;i++){
    const v = data[i]/128;
    const y = (v * h) / 2;
    i===0 ? ctx2d.moveTo(0,y) : ctx2d.lineTo(i*bw, y);
  }
  ctx2d.stroke();
}

function startViz(color){
  if (!analyser) return;
  const buf = new Uint8Array(analyser.fftSize);
  function loop(){
    animId = requestAnimationFrame(loop);
    analyser.getByteTimeDomainData(buf);
    drawWave(buf, color);
  }
  loop();
}

function stopViz(){ if(animId){ cancelAnimationFrame(animId); animId=null; } drawIdle(); }

/* ── Reverse buffer ── */
function reverseBuffer(buf){
  const ac = getCtx();
  const out = ac.createBuffer(buf.numberOfChannels, buf.length, buf.sampleRate);
  for(let c=0; c<buf.numberOfChannels; c++){
    const src = buf.getChannelData(c);
    const dst = out.getChannelData(c);
    const len = src.length;
    for(let i=0;i<len;i++) dst[i] = src[len-1-i];
  }
  return out;
}

/* ── Stop a source cleanly ── */
function stopSource(src){
  if(!src) return;
  try { src.stop(); } catch(e){}
}

function stopProgress(rafId, barEl){ if(rafId) cancelAnimationFrame(rafId); barEl.style.width='0%'; }

/* ── Generic play reversed ── */
function playReversed(revBuf, color, prBar, onEnd){
  const ac = getCtx();
  analyser = ac.createAnalyser();
  analyser.fftSize = 1024;
  const src = ac.createBufferSource();
  src.buffer = revBuf;
  src.connect(analyser);
  analyser.connect(ac.destination);

  const dur = revBuf.duration;
  const t0  = ac.currentTime;

  let prRaf = null;
  function tickPr(){
    const pct = Math.min(((ac.currentTime - t0) / dur) * 100, 100);
    prBar.style.width = pct + '%';
    if(pct < 100) prRaf = requestAnimationFrame(tickPr);
  }
  prBar.style.width = '0%';
  tickPr();

  startViz(color);
  src.start(0);
  src.onended = () => {
    if(prRaf) cancelAnimationFrame(prRaf);
    prBar.style.width = '0%';
    stopViz();
    onEnd(src);
  };
  return { src, prRaf: () => prRaf };
}

/* ── Generic record ── */
async function startRecord(group){
  // Si el permiso no está confirmado, mostramos el banner y esperamos
  if (!micGranted) {
    permBanner.hidden = false;
    permBanner.scrollIntoView({ behavior: 'smooth', block: 'center' });
    setStatus('', 'Necesitas permitir el micrófono primero', false);
    return;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  } catch(e){
    micGranted = false;
    permBanner.hidden = false;
    permDesc.textContent = 'Acceso denegado. Actívalo en la configuración del navegador (icono 🔒) y recarga.';
    setStatus('', 'Sin acceso al micrófono', false);
    return;
  }

  const ac = getCtx();
  analyser = ac.createAnalyser();
  analyser.fftSize = 1024;
  const micSrc = ac.createMediaStreamSource(stream);
  micSrc.connect(analyser);

  const recorder = new MediaRecorder(stream);
  const chunks = [];
  recorder.ondataavailable = e => { if(e.data.size>0) chunks.push(e.data); };

  if(group === 'orig'){
    origRecorder = recorder; origChunks = chunks;
    origRecorder.onstop = () => { stream.getTracks().forEach(t=>t.stop()); processOrig(); };
    origRecorder.start();
    recording = 'orig';
    btnRecOrig.classList.add('active');
    setIcon(iconRecOrig, 'stop');
    lblRecOrig.textContent = 'Detener grabación';
    btnPlayOrig.disabled = true;
    btnRecMimic.disabled = true;
    btnPlayMimic.disabled = true;
    setStatus('rec', 'Grabando Original…', true);
  } else {
    mimicRecorder = recorder; mimicChunks = chunks;
    mimicRecorder.onstop = () => { stream.getTracks().forEach(t=>t.stop()); processMimic(); };
    mimicRecorder.start();
    recording = 'mimic';
    btnRecMimic.classList.add('active');
    setIcon(iconRecMimic, 'stop');
    lblRecMimic.textContent = 'Detener grabación';
    btnRecOrig.disabled  = true;
    btnPlayOrig.disabled = true;
    btnPlayMimic.disabled = true;
    setStatus('rec', 'Grabando Mimic…', true);
  }
  startTimer();
  startViz('#e8433a');
}

function stopRecord(group){
  stopTimer(); stopViz();
  recording = null;
  if(group === 'orig'){
    if(origRecorder && origRecorder.state !== 'inactive') origRecorder.stop();
    btnRecOrig.classList.remove('active');
    setIcon(iconRecOrig, 'mic');
    lblRecOrig.textContent = 'Record Original';
    setStatus('', 'Procesando…', false);
  } else {
    if(mimicRecorder && mimicRecorder.state !== 'inactive') mimicRecorder.stop();
    btnRecMimic.classList.remove('active');
    setIcon(iconRecMimic, 'mic');
    lblRecMimic.textContent = 'Record Mimic';
    setStatus('', 'Procesando…', false);
  }
}

async function processOrig(){
  const blob = new Blob(origChunks, { type: 'audio/webm' });
  try {
    const ab = await blob.arrayBuffer();
    const ac = getCtx();
    origBuffer    = await ac.decodeAudioData(ab);
    origRevBuffer = reverseBuffer(origBuffer);
    btnPlayOrig.disabled  = false;
    btnRecMimic.disabled  = false;
    btnPlayMimic.disabled = !mimicRevBuffer;
    setStatus('', 'Original listo', false);
  } catch(e){
    setStatus('', 'Error al procesar', false);
    btnRecMimic.disabled  = false;
    btnPlayMimic.disabled = !mimicRevBuffer;
  }
}

async function processMimic(){
  const blob = new Blob(mimicChunks, { type: 'audio/webm' });
  try {
    const ab = await blob.arrayBuffer();
    const ac = getCtx();
    mimicBuffer    = await ac.decodeAudioData(ab);
    mimicRevBuffer = reverseBuffer(mimicBuffer);
    btnPlayMimic.disabled = false;
    btnRecOrig.disabled   = false;
    btnPlayOrig.disabled  = !origRevBuffer;
    setStatus('', 'Mimic listo', false);
  } catch(e){
    setStatus('', 'Error al procesar', false);
    btnRecOrig.disabled   = false;
    btnPlayOrig.disabled  = !origRevBuffer;
  }
}

/* ── Button: Record Original ── */
btnRecOrig.addEventListener('click', () => {
  if(recording === 'orig'){ stopRecord('orig'); return; }
  if(origPlaying){ stopOrigPlay(); }
  startRecord('orig');
});

/* ── Button: Play Backwards (original) ── */
btnPlayOrig.addEventListener('click', () => {
  if(origPlaying){ stopOrigPlay(); return; }
  if(!origRevBuffer) return;
  if(mimicPlaying) stopMimicPlay();

  origPlaying = true;
  btnPlayOrig.classList.add('active');
  setIcon(iconPlayOrig, 'stop');
  lblPlayOrig.textContent = 'Detener';
  btnRecOrig.disabled  = true;
  btnRecMimic.disabled = true;
  setStatus('play', 'Reproduciendo al revés…', false);

  const { src } = playReversed(origRevBuffer, '#3b82f6', prPlayOrig, (s) => {
    origSource  = null;
    origPlaying = false;
    resetPlayOrigUI();
    setStatus('', 'Original listo', false);
  });
  origSource = src;
});

function stopOrigPlay(){
  stopSource(origSource); origSource = null;
  origPlaying = false;
  prPlayOrig.style.width = '0%';
  stopViz();
  resetPlayOrigUI();
  setStatus('', origBuffer ? 'Original listo' : 'Listo', false);
}

function resetPlayOrigUI(){
  btnPlayOrig.classList.remove('active');
  setIcon(iconPlayOrig, 'back');
  lblPlayOrig.textContent = 'Play Backwards';
  btnRecOrig.disabled  = false;
  btnRecMimic.disabled = false;
}

/* ── Button: Record Mimic ── */
btnRecMimic.addEventListener('click', () => {
  if(recording === 'mimic'){ stopRecord('mimic'); return; }
  if(mimicPlaying){ stopMimicPlay(); }
  startRecord('mimic');
});

/* ── Button: Play Backwards (mimic) ── */
btnPlayMimic.addEventListener('click', () => {
  if(mimicPlaying){ stopMimicPlay(); return; }
  if(!mimicRevBuffer) return;
  if(origPlaying) stopOrigPlay();

  mimicPlaying = true;
  btnPlayMimic.classList.add('active');
  setIcon(iconPlayMimic, 'stop');
  lblPlayMimic.textContent = 'Detener';
  btnRecOrig.disabled  = true;
  btnRecMimic.disabled = true;
  setStatus('rev', 'Reproduciendo Mimic al revés…', false);

  const { src } = playReversed(mimicRevBuffer, '#34d399', prPlayMimic, (s) => {
    mimicSource  = null;
    mimicPlaying = false;
    resetPlayMimicUI();
    setStatus('', 'Mimic listo', false);
  });
  mimicSource = src;
});

function stopMimicPlay(){
  stopSource(mimicSource); mimicSource = null;
  mimicPlaying = false;
  prPlayMimic.style.width = '0%';
  stopViz();
  resetPlayMimicUI();
  setStatus('', mimicBuffer ? 'Mimic listo' : 'Listo', false);
}

function resetPlayMimicUI(){
  btnPlayMimic.classList.remove('active');
  setIcon(iconPlayMimic, 'back');
  lblPlayMimic.textContent = 'Play Backwards';
  btnRecOrig.disabled  = false;
  btnRecMimic.disabled = false;
}

/* ── Init ── */
drawIdle();

})();
</script>

</body></html>
